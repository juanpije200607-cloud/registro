<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Registro</title>
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Paleta y componentes tomados de la app anterior de JP: iOS neutro.
   No hay color de acento: lo seleccionado se rellena en casi negro o
   casi blanco, y el color solo significa estado (alerta, bien, mal). */
:root{
  --bg:#f2f2f4; --card:#ffffff; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6;
  --sep:#e3e3e7; --fill:#ebebee; --btn:#1d1d1f; --btn-ink:#ffffff;
  --warn:#b25000; --warn-bg:#fff1e3; --ok:#1f7a3d; --ok-bg:#e6f4ea;
  --bad:#c4291c; --bad-bg:#fdecea; --nav:rgba(250,250,252,.92);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --f-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink-2:#98989d; --ink-3:#636366;
  --sep:#2c2c2e; --fill:#2c2c2e; --btn:#f5f5f7; --btn-ink:#000000;
  --warn:#ff9f0a; --warn-bg:#33240f; --ok:#30d158; --ok-bg:#12291a;
  --bad:#ff6961; --bad-bg:#331614; --nav:rgba(22,22,24,.92);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 var(--f);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font-family:inherit}

#pantalla{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-left)) 20px max(16px,env(safe-area-inset-right))}
#pantalla>.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

h1{font:700 32px/1.1 var(--f-d);letter-spacing:-.02em;margin:0}
.sub{color:var(--ink-2);font-size:15px}
.eti,.cap{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.mini{font-size:13px;color:var(--ink-2)}
.num{font:700 32px/1.05 var(--f-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tab-num{font-variant-numeric:tabular-nums}

/* tarjeta agrupada estilo ajustes de iOS: sin borde, separadores de pelo */
.card{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.ac{background:var(--card)}
.card.mal{background:var(--card)}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.ren{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 14px;min-height:46px;font-size:15px}
.ren+.ren{border-top:.5px solid var(--sep)}
.card .ren{padding:11px 0}
.card .ren:first-of-type{border-top:.5px solid var(--sep)}

/* botones */
.b{appearance:none;border:0;border-radius:11px;background:var(--fill);color:var(--ink);
  font:500 15px var(--f);min-height:46px;padding:10px 12px;display:flex;align-items:center;
  justify-content:center;gap:6px;text-align:center}
.b.on{background:var(--btn);color:var(--btn-ink);font-weight:600}
.b.on .mini{color:var(--btn-ink);opacity:.72}
.b.cero{color:var(--ink-3)}
.b.gde{min-height:52px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font:600 17px var(--f)}
.b.gde:disabled{opacity:.35}
.b.chico{min-height:38px;border-radius:999px;font:600 14px var(--f);padding:8px 13px}
.rejilla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rejilla .b{flex-direction:column;gap:2px;min-height:56px}
.lista .b{justify-content:space-between;width:100%}

/* segmentado */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);
  font:500 14px var(--f);padding:9px 4px;border-radius:8px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}

/* campos */
.campo{width:100%;border:0;background:var(--fill);color:var(--ink);border-radius:11px;
  padding:13px 13px;font:600 19px var(--f);font-variant-numeric:tabular-nums;min-height:50px}
select.campo{font-weight:500;font-size:16px}

/* indicadores de estado */
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.alerta{color:var(--warn)} .malo{color:var(--bad)} .bueno{color:var(--ok)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:12px}
.kpi b{display:block;font:600 21px/1.15 var(--f-d);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink-2)}

/* barras */
.barras{display:flex;align-items:flex-end;gap:4px;height:64px}
.barras div{flex:1;border-radius:3px 3px 0 0;background:var(--ink-3);min-height:2px}
.barras div.hoy{background:var(--btn)}
.ejes{display:flex;gap:4px;font-size:11px;color:var(--ink-3)}
.ejes span{flex:1;text-align:center}
.track{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--btn);border-radius:3px}

nav{display:flex;border-top:.5px solid var(--sep);background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);
  padding:7px 0 calc(env(safe-area-inset-bottom) + 7px) 0}
nav button{flex:1;border:0;background:none;color:var(--ink-3);font-size:10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
nav button i{font-size:19px;font-style:normal;line-height:1}
nav button.on{color:var(--ink)}

#aviso{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 72px);
  background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:12px 14px;
  font-size:14px;font-weight:500;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50;max-width:480px;margin:0 auto}
#aviso.ver{opacity:1}
#hoja{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:60}
#hoja.ver{display:flex}
#hojaIn{width:100%;max-width:480px;margin:0 auto;background:var(--bg);
  border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left))
  calc(env(safe-area-inset-bottom) + 20px) max(16px,env(safe-area-inset-right));
  max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.cola{font-size:13px;color:var(--warn);padding:0 4px}
a{color:var(--ink-2)}
</style>
</head>
<body>
<div id="pantalla"><div class="wrap"><div class="sub" id="arranque">Abriendo…</div></div></div>
<nav id="nav"></nav>
<div id="aviso"></div>
<div id="hoja"><div id="hojaIn"></div></div>

<!-- Red de seguridad del arranque. Va EN el index y no en app.js a
     propósito: si el que no llega es app.js, cualquier aviso que viviera
     ahí tampoco llegaría. Sin esto, la app que no arranca se ve como una
     pantalla negra, sin una sola palabra. Pasó el 20 nov con datos
     móviles: el index cargaba (de ahí el negro, que es el fondo del modo
     oscuro) y app.js no, y no había forma de saberlo desde el teléfono. -->
<script>
function vqFallo(motivo) {
  var w = document.querySelector('#pantalla .wrap');
  if (!w || window.vqListo) return;
  w.innerHTML = '';
  var h = document.createElement('h1'); h.textContent = 'No abrió';
  var p = document.createElement('div'); p.className = 'sub';
  p.textContent = 'La app no se pudo cargar: ' + motivo +
    '. Casi siempre es la señal. Con wifi suele entrar a la primera.';
  var b = document.createElement('button'); b.className = 'b gde';
  b.textContent = 'Reintentar';
  b.onclick = function () { location.reload(); };
  w.appendChild(h); w.appendChild(p); w.appendChild(b);
}
/* El caso que de verdad pasa con mala señal no es que app.js falle: es
   que NUNCA TERMINA DE LLEGAR. Ahí onerror no dispara nunca y el de
   abajo tampoco corre, porque el navegador sigue esperando el script.
   Por eso hace falta un reloj, y por eso arranca aquí, antes de pedirlo.
   JP, 20 nov: "en la parte de abajo se ve que no acaba de cargar y la
   pantalla negra". */
setTimeout(function () { vqFallo('está tardando demasiado'); }, 10000);
</script>
<script src="app.js?v=24" onerror="vqFallo('no se bajó app.js')"></script>
<script>
/* app.js corre de corrido, así que para cuando llega aquí ya puso vqListo.
   Si no está, llegó pero tronó a la mitad. */
if (!window.vqListo) vqFallo('se bajó pero no arrancó');
</script>
</body>
</html>
