<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Registro">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<title>Registro</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f5f5f7;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:32px;margin:0;letter-spacing:-.02em}
p{margin:0;color:#98989d;font-size:15px}
.card{background:#1c1c1e;border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.row b{font-variant-numeric:tabular-nums}
.seg{display:flex;background:#2c2c2e;border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:#f5f5f7;font:500 15px inherit;padding:10px;border-radius:8px}
.seg button[aria-pressed=true]{background:#636366}
.btn{border:0;border-radius:14px;padding:18px;font:600 18px inherit;background:#f5f5f7;color:#000;width:100%}
.btn:active{opacity:.7}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#98989d}
.dot{width:8px;height:8px;border-radius:50%;background:#636366}
.ok{background:#30d158}.warn{background:#ff9f0a}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:.5px solid #2c2c2e;font-size:15px}
li:first-child{border-top:0}
li span:last-child{color:#98989d;white-space:nowrap}
</style>
</head>
<body>
<main>
  <div class="pill"><span class="dot" id="dot"></span><span id="estado">Cargando…</span></div>
  <h1>Prueba</h1>
  <p>Un toque escribe una fila en el Sheet de prueba. Prueba también en modo avión.</p>
  <div class="seg" id="quien"></div>
  <button class="btn" id="go" type="button">Registrar</button>
  <div class="card">
    <div class="row"><span>Abrió en</span><b id="t-abrir">—</b></div>
    <div class="row"><span>Último envío tardó</span><b id="t-envio">—</b></div>
    <div class="row"><span>Datos del último envío</span><b id="t-bytes">—</b></div>
    <div class="row"><span>Por subir</span><b id="t-cola">0</b></div>
  </div>
  <div class="card"><ul id="lista"><li><span>Sin registros en este celular</span><span></span></li></ul></div>
</main>
<script>
(function(){
var URL_API='https://script.google.com/macros/s/AKfycbyyFtT1kV1qOdaumVdInu2ix_lf9Envu8YS-HwYEPa8YPDfaNITOuYHaio-pGs86wNQxg/exec';
var $=function(s){return document.querySelector(s)};
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cola=get('p_cola',[]),hechos=get('p_hechos',[]),quien=get('p_quien','JP'),enviando=false;

function pintarQuien(){var el=$('#quien');el.innerHTML='';['JP','Franco'].forEach(function(n){
  var b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed',n===quien);
  b.onclick=function(){quien=n;set('p_quien',n);pintarQuien()};el.appendChild(b)})}

function pintar(){
  $('#t-cola').textContent=cola.length;
  var d=$('#dot'),e=$('#estado');
  if(cola.length){d.className='dot warn';e.textContent=cola.length+' por subir'+(navigator.onLine?'':' · sin señal')}
  else if(!navigator.onLine){d.className='dot warn';e.textContent='Sin señal'}
  else{d.className='dot ok';e.textContent='Al día'}
  var todos=cola.map(function(c){return {t:c.texto,s:'Por subir'}}).concat(hechos.slice(0,8).map(function(h){return {t:h.texto,s:'Subido'}}));
  var ul=$('#lista');ul.innerHTML='';
  if(!todos.length){todos=[{t:'Sin registros en este celular',s:''}]}
  todos.forEach(function(x){var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
    a.textContent=x.t;b.textContent=x.s;li.appendChild(a);li.appendChild(b);ul.appendChild(li)});
}

function subir(){
  if(enviando||!cola.length||!navigator.onLine)return;
  enviando=true;var op=cola[0],cuerpo=JSON.stringify(op),t0=performance.now();
  fetch(URL_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:cuerpo})
   .then(function(r){return r.json()})
   .then(function(j){
     if(!j||!j.ok)throw new Error('respuesta');
     cola=cola.filter(function(c){return c.folio!==op.folio});hechos.unshift(op);hechos=hechos.slice(0,20);
     set('p_cola',cola);set('p_hechos',hechos);
     $('#t-envio').textContent=(Math.round(performance.now()-t0)/1000).toFixed(1)+' s';
     $('#t-bytes').textContent=cuerpo.length+' bytes';
     enviando=false;pintar();subir();
   })
   .catch(function(){enviando=false;pintar()});
}

$('#go').onclick=function(){
  var ahora=new Date();
  var op={folio:quien+'-'+ahora.getTime().toString(36)+'-'+Math.random().toString(36).slice(2,6),quien:quien,
    texto:'Toque de las '+ahora.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit',second:'2-digit'})};
  cola.push(op);set('p_cola',cola);pintar();subir();
};
window.addEventListener('online',function(){pintar();subir()});
window.addEventListener('offline',pintar);
document.addEventListener('visibilitychange',function(){if(!document.hidden)subir()});
setInterval(subir,30000);
window.addEventListener('load',function(){
  var n=performance.getEntriesByType('navigation')[0];
  if(n)$('#t-abrir').textContent=(Math.round(n.loadEventStart||performance.now())/1000).toFixed(1)+' s';
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
pintarQuien();pintar();subir();
})();
</script>
</body>
</html>
