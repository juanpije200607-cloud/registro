<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0B">
<title>Registro</title>
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #0A0A0B; --card: #161618; --card2: #1F1F22; --line: #27272A;
  --txt: #F4F4F5; --dim: #A1A1AA; --faint: #71717A;
  --ac: #7E9BB8; --ac-soft: #141A20; --ac-bright: #A7BDD1; --ac-ink: #06121F;
  --bad: #FF8F8F; --bad-line: #532222; --good: #4ADE80;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font-family: inherit; }
input { font-size: 17px; }
#pantalla { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: env(safe-area-inset-top) 20px 16px 20px; }
#pantalla.tope { padding-top: calc(env(safe-area-inset-top) + 48px); }

h1 { margin: 0; font-size: 29px; font-weight: 700; letter-spacing: -0.5px; }
.sub { font-size: 13px; color: var(--dim); }
.fila { display: flex; align-items: center; justify-content: space-between; }
.col { display: flex; flex-direction: column; }
.g6 { gap: 6px; } .g8 { gap: 8px; } .g12 { gap: 12px; } .g16 { gap: 16px; }
.eti { font-size: 12px; font-weight: 600; letter-spacing: 0.6px; color: var(--dim);
  text-transform: uppercase; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 15px; }
.card.ac { background: var(--ac-soft); border-color: var(--ac); }
.card.mal { border-color: var(--bad-line); }
.num { font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
.mini { font-size: 11px; color: var(--dim); }

.b { min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: #E4E4E7; font-size: 14px; padding: 10px 12px; }
.b.on { border-color: var(--ac); background: var(--ac-soft); color: var(--ac-bright);
  font-weight: 600; }
.b.gde { min-height: 56px; border: none; background: var(--ac); color: var(--ac-ink);
  font-size: 17px; font-weight: 700; border-radius: 16px; }
.b.gde:disabled { background: var(--card2); color: var(--faint); }
.b.chico { min-height: 38px; font-size: 13px; border-radius: 10px; }
.rejilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rejilla .b { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; min-height: 54px; }
.lista .b { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.cero { opacity: 0.45; }
.campo { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid var(--ac);
  background: #0F0F10; color: var(--txt); font-size: 20px; font-weight: 600; padding: 0 14px; }
.seg { display: flex; background: var(--card); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 34px; border-radius: 9px; border: none;
  background: transparent; color: var(--dim); font-size: 13px; }
.seg button.on { background: var(--ac); color: var(--ac-ink); font-weight: 600; }
.ren { padding: 8px 0; border-top: 1px solid var(--line); display: flex;
  justify-content: space-between; font-size: 14px; gap: 10px; }
.barra { height: 4px; border-radius: 2px; background: var(--ac); }
.barras { display: flex; align-items: flex-end; gap: 5px; height: 48px; }
.barras div { flex: 1; border-radius: 3px 3px 0 0; background: #3F3F46; }
.barras div.hoy { background: var(--ac); }

nav { display: flex; border-top: 1px solid var(--line); background: #111113;
  padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px) 0; }
nav button { flex: 1; border: none; background: none; color: var(--faint);
  font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 2px 0; }
nav button i { font-size: 18px; font-style: normal; }
nav button.on { color: var(--ac); }
nav button b { position: absolute; transform: translate(14px, -4px); background: var(--bad);
  color: #1A0404; font-size: 9px; border-radius: 8px; padding: 0 4px; }

#aviso { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 72px);
  background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 14px; font-size: 13px; text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .2s; z-index: 50; }
#aviso.ver { opacity: 1; }
#hoja { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
  align-items: flex-end; z-index: 60; }
#hoja.ver { display: flex; }
#hojaIn { width: 100%; background: #18181B; border-top: 1px solid var(--ac);
  border-radius: 20px 20px 0 0; padding: 16px 20px calc(env(safe-area-inset-bottom) + 20px) 20px;
  max-height: 88%; overflow-y: auto; }
.cola { font-size: 11px; color: var(--ac-bright); }
a { color: var(--ac-bright); }
</style>
</head>
<body>
<div id="pantalla" class="tope"></div>
<nav id="nav"></nav>
<div id="aviso"></div>
<div id="hoja"><div id="hojaIn"></div></div>
<script src="app.js"></script>
</body>
</html>
